name: Validate ADE

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill package links and metadata
        run: sh scripts/validate-skills.sh
      - name: Validate shared layout
        run: python3 scripts/validate-ade.py
      - name: Test bootstrap safety
        run: python3 -m unittest discover -s tests -v
